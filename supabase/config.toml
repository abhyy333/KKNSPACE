# KKN SPACE — Supabase Edge Functions Configuration

[functions.admin-list-users]
verify_jwt = true

[functions.admin-invite-user]
verify_jwt = true

[functions.admin-update-membership]
verify_jwt = true

[functions.admin-revoke-invitation]
verify_jwt = true

[functions.admin-accept-invitation]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true

[functions.workspace-get-signed-url]
verify_jwt = true

[functions.public-team-photo]
verify_jwt = false

[auth]
site_url = "https://kknspace.vercel.app"
additional_redirect_urls = [
  "https://kknspace.vercel.app",
  "https://kknspace.vercel.app/**",
  "https://kknspace.vercel.app/auth/accept-invite",
  "https://kknspace.vercel.app/auth/reset-password",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
  "http://localhost:5173",
  "http://localhost:5173/**"
]

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.rate_limit]
email_sent = 30

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
